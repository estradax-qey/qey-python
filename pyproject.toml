[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.2"]
build-backend = "scikit_build_core.build"

[project]
name = "qey"
version = "0.1.0"
description = "Python bindings for qey, an embedded in-memory key-value store"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = ["Operating System :: POSIX :: Linux"]

[project.urls]
Source = "https://github.com/estradax-qey/qey-python"
Core = "https://github.com/estradax-qey/qey"

[tool.scikit-build]
wheel.packages = ["src/qey"]
wheel.py-api = "cp312"
cmake.version = ">=3.18"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-requires = "pytest"
test-command = "pytest {project}/tests"
